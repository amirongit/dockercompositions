services:
  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
    networks:
      - "dockernet"
    ports:
      - "5434:5432"
    restart: "unless-stopped"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    volumes:
      - "nuq_postgres:/var/lib/postgresql/data"

volumes:
  nuq_postgres:
    driver: local

networks:
  dockernet:
    external: true
    name: "dockernet"
