services:
  nats:
    image: focker.ir/nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - dockernet

    volumes:
      - nats_data:/data
      - "./nats-server.conf:/etc/nats/nats-server.conf:ro"

    restart: "unless-stopped"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    command: ["-c", "/etc/nats/nats-server.conf"]

networks:
  dockernet:
    name: dockernet
    external: true

volumes:
  nats_data:
    driver: local

