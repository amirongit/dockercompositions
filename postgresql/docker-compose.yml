services:
  postgresql:
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
    image: focker.ir/postgres:latest
    networks:
      - "dockernet"
    ports:
      - "5432:5432"
    restart: "unless-stopped"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    volumes:
      - "postgres_data:/var/lib/postgresql"

volumes:
  postgres_data:
    driver: local

networks:
  dockernet:
    external: true
    name: "dockernet"
