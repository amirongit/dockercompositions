services:
  postgresql-pgvector:
    build:
      context: "."
      dockerfile: "PGVector.Dockerfile"
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
    image: postgres-pgvector:latest
    networks:
      - "dockernet"
    ports:
      - "5433:5432"
    restart: "unless-stopped"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    volumes:
      - "postgres_pgvector_data:/var/lib/postgresql"

volumes:
  postgres_pgvector_data:
    driver: local

networks:
  dockernet:
    external: true
    name: "dockernet"
