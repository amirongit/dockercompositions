services:
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    environment:
      - "HOST=$HOST"
      - "PORT=$PORT"
      - "ENV=$ENV"
      - "LOGGING_LEVEL=$LOGGING_LEVEL"
      - "REDIS_URL=$REDIS_URL"
      - "REDIS_RATE_LIMIT_URL=$REDIS_RATE_LIMIT_URL"
      - "PLAYWRIGHT_MICROSERVICE_URL=$PLAYWRIGHT_MICROSERVICE_URL"
      - "NUQ_RABBITMQ_URL=$NUQ_RABBITMQ_URL"
      - "POSTGRES_USER=$POSTGRES_USER"
      - "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
      - "POSTGRES_DB=$POSTGRES_DB"
      - "POSTGRES_HOST=$POSTGRES_HOST"
      - "POSTGRES_PORT=$POSTGRES_PORT"
      - "USE_DB_AUTHENTICATION=$USE_DB_AUTHENTICATION"
      - "NUM_WORKERS_PER_QUEUE=$NUM_WORKERS_PER_QUEUE"
      - "CRAWL_CONCURRENT_REQUESTS=$CRAWL_CONCURRENT_REQUESTS"
      - "MAX_CONCURRENT_JOBS=$MAX_CONCURRENT_JOBS"
      - "BROWSER_POOL_SIZE=$BROWSER_POOL_SIZE"
      - "EXTRACT_WORKER_PORT=$EXTRACT_WORKER_PORT"
      - "WORKER_PORT=$WORKER_PORT"
      - "HARNESS_STARTUP_TIMEOUT_MS=$HARNESS_STARTUP_TIMEOUT_MS"
      - "OPENAI_API_KEY=$OPENAI_API_KEY"
      - "OPENAI_BASE_URL=$OPENAI_BASE_URL"
      - "MODEL_NAME=$MODEL_NAME"
      - "OLLAMA_BASE_URL=$OLLAMA_BASE_URL"
      - "SEARXNG_ENDPOINT=$SEARXNG_ENDPOINT"
      - "SEARXNG_ENGINES=$SEARXNG_ENGINES"
      - "SEARXNG_CATEGORIES=$SEARXNG_CATEGORIES"
      - "PROXY_SERVER=$PROXY_SERVER"
      - "PROXY_USERNAME=$PROXY_USERNAME"
      - "PROXY_PASSWORD=$PROXY_PASSWORD"
      - "SUPABASE_URL=$SUPABASE_URL"
      - "SUPABASE_ANON_TOKEN=$SUPABASE_ANON_TOKEN"
      - "SUPABASE_SERVICE_TOKEN=$SUPABASE_SERVICE_TOKEN"
      - "SELF_HOSTED_WEBHOOK_URL=$SELF_HOSTED_WEBHOOK_URL"
      - "AUTUMN_SECRET_KEY=$AUTUMN_SECRET_KEY"
      - "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL"
      - "BULL_AUTH_KEY=$BULL_AUTH_KEY"
      - "TEST_API_KEY=$TEST_API_KEY"
    command: node dist/src/harness.js --start-docker
    networks:
      - "dockernet"
    ports:
      - "$PORT:$PORT/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: "unless-stopped"
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  dockernet:
    external: true
    name: "dockernet"
