services:
  redis:
    image: focker.ir/redis:latest
    command: redis-server --bind 0.0.0.0
    networks:
      - "dockernet"
    ports:
      - "6379:6379"
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    volumes:
      - "redis_data:/data"

volumes:
  redis_data:
    driver: local

networks:
  dockernet:
    external: true
    name: "dockernet"
